<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧸 어린이집 등하원 알리미</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --primary-hover: #fa5252;
            --bg-color: #1a202c;         
            --card-bg: #2d3748;          
            --text-main: #f7fafc;        
            --text-sub: #a0aec0;         
            --border-color: #4a5568;     
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 15px; 
            color: var(--text-main); 
        }

        .container { 
            max-width: 440px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); 
        }

        h2 { 
            text-align: center; 
            color: var(--primary); 
            margin-top: 0; 
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 800;
        }
        
        .user-banner { 
            background: #1a365d; 
            padding: 12px 15px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            font-size: 13px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-left: 4px solid #63b3ed;
            color: #e2e8f0;
        }
        .user-banner select { 
            width: auto; 
            margin: 0; 
            padding: 6px 12px; 
            font-weight: bold;
            color: #2b6cb0;
            background: #fff;
            border-radius: 6px;
            border: 1px solid #63b3ed;
        }

        .tab-menu { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 20px; 
            background: #1a202c; 
            padding: 5px; 
            border-radius: 10px; 
        }
        .tab-btn { 
            flex: 1; 
            padding: 11px 0; 
            border: none; 
            background: none; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 13px; 
            color: var(--text-sub);
            transition: all 0.2s ease;
        }
        .tab-btn.active { 
            background: var(--primary); 
            color: white; 
            box-shadow: 0 3px 8px rgba(255, 107, 107, 0.4);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .box { 
            background: #232b3b; 
            padding: 18px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            border: 1px solid var(--border-color);
            overflow: hidden; /* 요소가 박스를 벗어나지 않도록 강제 제어 */
        }

        label { 
            font-weight: bold; 
            display: block; 
            margin-bottom: 6px; 
            font-size: 13px; 
            color: var(--text-main); 
        }

        select, textarea, input, button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 4px; 
            margin-bottom: 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            box-sizing: border-box !important; /* 패딩이 박스 크기를 밀어내지 않도록 고정 */
            font-size: 14px;
            background: #1a202c;
            color: var(--text-main);
            outline: none;
        }
        
        select:focus, textarea:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.25);
        }

        button { 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s;
            margin-bottom: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        button:hover { background-color: var(--primary-hover); }
        
        .memo-list { 
            background: #232b3b; 
            padding: 14px 16px; 
            border-radius: 10px; 
            margin-top: 12px; 
            font-size: 13px; 
            border-left: 4px solid var(--primary);
            border: 1px solid var(--border-color);
        }
        .memo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--text-sub);
        }
        .memo-content {
            color: var(--text-main);
            line-height: 1.4;
            word-break: break-all;
            margin-bottom: 10px;
        }
        
        .memo-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: #1a202c;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 6px;
            width: auto;
            margin: 0;
            cursor: pointer;
        }
        .action-btn.active {
            background: #3182ce;
            border-color: #63b3ed;
            color: white;
        }
        .action-btn:hover { background: #4a5568; }

        .participant-info {
            font-size: 11px;
            color: #a0aec0;
            margin-bottom: 8px;
        }

        .comment-section {
            background: #1a202c;
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 8px;
            border-top: 1px dashed var(--border-color);
        }
        .comment-item {
            font-size: 11px;
            margin-bottom: 6px;
            color: #e2e8f0;
            border-bottom: 1px solid #2d3748;
            padding-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .comment-text-area {
            word-break: break-all;
            flex: 1;
            margin-right: 5px;
        }
        .comment-btns, .memo-owner-btns {
            display: flex;
            gap: 4px;
        }
        .mini-btn {
            background: #4a5568;
            border: none;
            color: white;
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            width: auto;
            margin: 0;
        }
        .mini-btn:hover { background: #718096; }
        .mini-btn.delete { background: #9b2c2c; }
        .mini-btn.delete:hover { background: #c53030; }

        .comment-input-box {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            margin-bottom: 0;
        }
        .comment-input-box input {
            margin: 0;
            padding: 6px 8px;
            font-size: 11px;
        }
        .comment-input-box button {
            width: auto;
            margin: 0;
            padding: 6px 12px;
            font-size: 11px;
        }

        .calendar-box { text-align: center; }
        .calendar-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
        }
        .calendar-header button { 
            width: auto; 
            padding: 6px 14px; 
            margin: 0; 
            font-size: 12px; 
            background: #4a5568;
        }
        .calendar-header button:hover { background: #718096; }

        .calendar-table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 4px; 
        }
        .calendar-table th { 
            background: #1a202c; 
            color: var(--text-sub); 
            text-align: center; 
            font-size: 12px; 
            padding: 6px 0; 
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        .calendar-table td { 
            border: 1px solid var(--border-color); 
            padding: 4px; 
            font-size: 11px; 
            height: 78px; 
            vertical-align: top; 
            text-align: left; 
            width: 20%; 
            border-radius: 6px;
            background: #232b3b; 
        }
        .calendar-table td.today { 
            background: #2a2533; 
            border: 2px solid var(--primary); 
        }
        .calendar-table td.empty { background: #1a202c; border: 1px dashed #2d3748; }
        
        .date-num {
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 3px;
            color: var(--text-main);
            text-align: center;
            background: #1a202c;
            border-radius: 4px;
            padding: 2px 0;
        }
        
        .day-content {
            display: flex;
            flex-direction: column;
            height: calc(100% - 20px);
        }
        .schedule-morning, .schedule-evening {
            flex: 1; 
            font-size: 11px; 
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .schedule-morning {
            color: #63b3ed; 
            border-bottom: 1px dashed #4a5568; 
        }
        .schedule-evening {
            color: #fc8181; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🧸 우리 아이 등하원 알리미</h2>

    <div class="user-banner">
        <span>📱 현재 사용자: <strong id="displayUser" style="color:#63b3ed;">설정 필요</strong></span>
        <select id="deviceUser" onchange="changeDeviceUser()">
            <option value="">선택하기</option>
            <option value="아빠">아빠</option>
            <option value="엄마">엄마</option>
            <option value="외할머니">외할머니</option>
            <option value="친할머니">친할머니</option>
        </select>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab(0)">등하원 설정하기</button>
        <button class="tab-btn" onclick="switchTab(1)">달력 보기</button>
        <button class="tab-btn" onclick="switchTab(2)">가족 알림장</button>
    </div>

    <div class="tab-content active">
        <div class="box">
            <label>📅 날짜 선택</label>
            <input type="date" id="selectDate">

            <label>☀️ 등원하는 사람은</label>
            <select id="morningUser">
                <option value="아빠">아빠</option>
                <option value="엄마">엄마</option>
                <option value="외할머니">외할머니</option>
                <option value="친할머니">친할머니</option>
            </select>

            <label>🌙 하원하는 사람은</label>
            <select id="eveningUser">
                <option value="아빠">아빠</option>
                <option value="엄마">엄마</option>
                <option value="외할머니">외할머니</option>
                <option value="친할머니">친할머니</option>
            </select>
            <button onclick="saveSchedule()">✨저장하기</button>
        </div>
    </div>

    <div class="tab-content">
        <div class="box calendar-box">
            <div class="calendar-header">
                <button onclick="moveMonth(-1)">◀ 이전달</button>
                <h3 id="calendarTitle" style="margin:0; font-size:15px; color:var(--text-main);">2026년 8월</h3>
                <button onclick="moveMonth(1)">다음달 ▶</button>
            </div>
            <table class="calendar-table">
                <thead>
                    <tr>
                        <th>월</th><th>화</th><th>수</th><th>목</th><th>금</th>
                    </tr>
                </thead>
                <tbody id="calendarBody">
                </tbody>
            </table>
        </div>
    </div>

    <div class="tab-content">
        <div class="box">
            <label>📝 실시간 공유 메모</label>
            <textarea id="memoText" rows="3" placeholder="약 투여, 준비물 등 특이사항을 적어주세요"></textarea>
            <button onclick="saveMemo()">💬 메모 남기기</button>
        </div>
        <div id="memoBoard" style="margin-top: 10px;">
            <div style="font-size:12px; color:var(--text-sub); text-align:center; padding:15px;">데이터 불러오는 중...</div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyHPJ1Uykyj0bZM4GOBBZ5KXbLgBX2mNrF_NeFT8KaaX-ucLfaYN9olHzNnC1F_uNM/exec';

    let todayObj = new Date();
    let currentYear = todayObj.getFullYear();
    let currentMonth = todayObj.getMonth();
    let serverSchedule = {};
    let memoListCache = [];

    document.getElementById('selectDate').valueAsDate = todayObj;

    window.onload = function() {
        initDeviceUser();
        fetchAllData();
    }

    function initDeviceUser() {
        let savedUser = localStorage.getItem('my_device_user');
        if(savedUser) {
            document.getElementById('deviceUser').value = savedUser;
            document.getElementById('displayUser').innerText = savedUser;
        }
    }

    function changeDeviceUser() {
        let selected = document.getElementById('deviceUser').value;
        if(selected) {
            localStorage.setItem('my_device_user', selected);
            document.getElementById('displayUser').innerText = selected;
            alert("이 기기의 사용자가 '" + selected + "(으)로' 고정되었습니다!");
            renderMemos();
        }
    }

    document.getElementById('selectDate').addEventListener('change', loadScheduleForDate);

    function switchTab(index) {
        let buttons = document.querySelectorAll('.tab-btn');
        let contents = document.querySelectorAll('.tab-content');
        
        buttons.forEach((btn, idx) => {
            if(idx === index) {
                btn.classList.add('active');
                contents[idx].classList.add('active');
            } else {
                btn.classList.remove('active');
                contents[idx].classList.remove('active');
            }
        });
        if(index === 1) generateCalendar();
    }

    function fetchAllData() {
        if (API_URL.includes('여기에')) {
            alert('HTML 코드 내의 API_URL에 구글 웹 앱 주소를 입력해주세요!');
            return;
        }

        fetch(API_URL + '?action=getSchedule')
            .then(res => res.json())
            .then(data => {
                serverSchedule = data;
                loadScheduleForDate();
                generateCalendar();
            })
            .catch(err => console.log('스케줄 로딩 실패', err));

        fetch(API_URL + '?action=getMemos')
            .then(res => res.json())
            .then(data => {
                memoListCache = data;
                renderMemos();
            })
            .catch(err => console.log('메모 로딩 실패', err));
    }

    function syncMemosToServer() {
        let payload = {
            action: 'saveMemosAll',
            memos: memoListCache
        };

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
            fetchAllData();
        })
        .catch(err => {
            console.log('서버 동기화 오류', err);
        });
    }

    function renderMemos() {
        let board = document.getElementById('memoBoard');
        board.innerHTML = '';
        if(memoListCache.length === 0) {
            board.innerHTML = '<div style="font-size:12px; color:var(--text-sub); text-align:center; padding:15px;">등록된 메모가 없습니다.</div>';
            return;
        }
        
        let currentUser = localStorage.getItem('my_device_user') || '';

        memoListCache.forEach((m, index) => {
            let likesArr = m.likes || [];
            let likeCount = likesArr.length;
            let hasLiked = likesArr.includes(currentUser);
            let likeBtnClass = hasLiked ? 'action-btn active' : 'action-btn';

            let checksArr = m.checks || [];
            let hasChecked = checksArr.includes(currentUser);
            let checkBtnClass = hasChecked ? 'action-btn active' : 'action-btn';
            let checkText = hasChecked ? '✔️ 확인완료' : '☑️ 체크하기';

            let memoOwnerBtns = '';
            if (m.user === currentUser) {
                memoOwnerBtns = `
                    <div class="memo-owner-btns">
                        <button class="mini-btn" onclick="editMemo(${index})">수정</button>
                        <button class="mini-btn delete" onclick="deleteMemo(${index})">삭제</button>
                    </div>
                `;
            }

            let commentsHtml = '';
            if(m.comments && m.comments.length > 0) {
                m.comments.forEach((c, cIndex) => {
                    let isMyComment = (c.user === currentUser);
                    let commentBtns = '';
                    if(isMyComment) {
                        commentBtns = `
                            <div class="comment-btns">
                                <button class="mini-btn" onclick="editComment(${index}, ${cIndex})">수정</button>
                                <button class="mini-btn delete" onclick="deleteComment(${index}, ${cIndex})">삭제</button>
                            </div>
                        `;
                    }
                    commentsHtml += `
                        <div class="comment-item">
                            <div class="comment-text-area"><strong>${c.user}:</strong> ${c.text}</div>
                            ${commentBtns}
                        </div>
                    `;
                });
            }

            let div = document.createElement('div');
            div.className = 'memo-list';
            div.innerHTML = `
                <div class="memo-header">
                    <strong>👤 ${m.user} (${m.time})</strong>
                    ${memoOwnerBtns}
                </div>
                <div class="memo-content">${m.text}</div>
                <div class="memo-actions">
                    <button class="${likeBtnClass}" onclick="toggleLike(${index})">👍 좋아요 (${likeCount})</button>
                    <button class="${checkBtnClass}" onclick="toggleCheck(${index})">${checkText}</button>
                </div>
                <div class="participant-info">
                    <div>👍 좋아요 한 사람: ${likesAuthorText(likesArr)}</div>
                    <div>☑️ 체크한 사람: ${likesAuthorText(checksArr)}</div>
                </div>
                <div class="comment-section">
                    <div id="commentList_${index}">${commentsHtml}</div>
                    <div class="comment-input-box">
                        <input type="text" id="commentInput_${index}" placeholder="댓글을 입력하세요">
                        <button onclick="addComment(${index})">등록</button>
                    </div>
                </div>
            `;
            board.appendChild(div);
        });
    }

    function likesAuthorText(arr) {
        if(!arr || arr.length === 0) return '없음';
        return arr.join(', ');
    }

    function saveSchedule() {
        let date = document.getElementById('selectDate').value;
        let morning = document.getElementById('morningUser').value;
        let evening = document.getElementById('eveningUser').value;
        
        let payload = {
            action: 'saveSchedule',
            date: date,
            morning: morning,
            evening: evening
        };

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
            alert(date + " 정상적으로 저장되었습니다!");
            fetchAllData();
        })
        .catch(err => {
            alert('저장 중 오류가 발생했습니다.');
            console.log(err);
        });
    }

    function loadScheduleForDate() {
        let date = document.getElementById('selectDate').value;
        if(serverSchedule[date]) {
            document.getElementById('morningUser').value = serverSchedule[date].morning || '아빠';
            document.getElementById('eveningUser').value = serverSchedule[date].evening || '아빠';
        } else {
            document.getElementById('morningUser').value = '아빠';
            document.getElementById('eveningUser').value = '아빠';
        }
    }

    function saveMemo() {
        let user = localStorage.getItem('my_device_user');
        if(!user) return alert("상단에서 먼저 본인의 사용자(아빠/엄마 등)를 선택해주세요!");
        
        let text = document.getElementById('memoText').value;
        if(!text.trim()) return alert("내용을 입력해주세요!");

        let newMemo = {
            user: user,
            text: text,
            time: new Date().toLocaleString(),
            likes: [],
            checks: [],
            comments: []
        };

        memoListCache.unshift(newMemo);
        document.getElementById('memoText').value = '';
        syncMemosToServer();
    }

    function editMemo(memoIndex) {
        let memo = memoListCache[memoIndex];
        let newText = prompt("메모를 수정하세요:", memo.text);
        if(newText !== null && newText.trim() !== "") {
            memo.text = newText.trim();
            syncMemosToServer();
        }
    }

    function deleteMemo(memoIndex) {
        if(confirm("정말 이 메모를 삭제하시겠습니까?")) {
            memoListCache.splice(memoIndex, 1);
            syncMemosToServer();
        }
    }

    function toggleLike(index) {
        let user = localStorage.getItem('my_device_user');
        if(!user) return alert("상단에서 먼저 본인의 사용자(아빠/엄마 등)를 선택해주세요!");

        if(!memoListCache[index].likes) {
            memoListCache[index].likes = [];
        }

        let arr = memoListCache[index].likes;
        let pos = arr.indexOf(user);
        if(pos > -1) {
            arr.splice(pos, 1);
        } else {
            arr.push(user);
        }
        syncMemosToServer();
    }

    function toggleCheck(index) {
        let user = localStorage.getItem('my_device_user');
        if(!user) return alert("상단에서 먼저 본인의 사용자(아빠/엄마 등)를 선택해주세요!");

        if(!memoListCache[index].checks) {
            memoListCache[index].checks = [];
        }

        let arr = memoListCache[index].checks;
        let pos = arr.indexOf(user);
        if(pos > -1) {
            arr.splice(pos, 1);
        } else {
            arr.push(user);
        }
        syncMemosToServer();
    }

    function addComment(index) {
        let user = localStorage.getItem('my_device_user');
        if(!user) return alert("상단에서 먼저 본인의 사용자(아빠/엄마 등)를 선택해주세요!");

        let input = document.getElementById(`commentInput_${index}`);
        let text = input.value;
        if(!text.trim()) return alert("댓글 내용을 입력해주세요!");

        if(!memoListCache[index].comments) {
            memoListCache[index].comments = [];
        }
        memoListCache[index].comments.push({ user: user, text: text });
        input.value = '';
        syncMemosToServer();
    }

    function editComment(memoIndex, commentIndex) {
        let comment = memoListCache[memoIndex].comments[commentIndex];
        let newText = prompt("댓글을 수정하세요:", comment.text);
        if(newText !== null && newText.trim() !== "") {
            comment.text = newText.trim();
            syncMemosToServer();
        }
    }

    function deleteComment(memoIndex, commentIndex) {
        if(confirm("정말 이 댓글을 삭제하시겠습니까?")) {
            memoListCache[memoIndex].comments.splice(commentIndex, 1);
            syncMemosToServer();
        }
    }

    function moveMonth(step) {
        currentMonth += step;
        if(currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        } else if(currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        generateCalendar();
    }

    function generateCalendar() {
        document.getElementById('calendarTitle').innerText = `${currentYear}년 ${currentMonth + 1}월`;

        let firstDayObj = new Date(currentYear, currentMonth, 1);
        let lastDateObj = new Date(currentYear, currentMonth + 1, 0);
        
        let lastDate = lastDateObj.getDate();
        let tbody = document.getElementById('calendarBody');
        tbody.innerHTML = '';

        let row = document.createElement('tr');
        let firstDayOfWeek = firstDayObj.getDay();
        let startIndex = 0;
        
        if (firstDayOfWeek >= 1 && firstDayOfWeek <= 5) {
            startIndex = firstDayOfWeek - 1;
        } else if (firstDayOfWeek === 6) {
            startIndex = 5;
        }

        let currentCellCount = 0;
        if (firstDayOfWeek >= 1 && firstDayOfWeek <= 5) {
            for (let i = 0; i < startIndex; i++) {
                let emptyCell = document.createElement('td');
                emptyCell.className = 'empty';
                row.appendChild(emptyCell);
                currentCellCount++;
            }
        }

        for (let day = 1; day <= lastDate; day++) {
            let dateObj = new Date(currentYear, currentMonth, day);
            let dayOfWeek = dateObj.getDay();

            if (dayOfWeek === 0 || dayOfWeek === 6) continue;

            let cell = document.createElement('td');
            let mm = String(currentMonth + 1).padStart(2, '0');
            let dd = String(day).padStart(2, '0');
            let dateStr = `${currentYear}-${mm}-${dd}`;

            let todayStr = new Date().toISOString().split('T')[0];
            if (dateStr === todayStr) {
                cell.classList.add('today');
            }

            let mAssign = serverSchedule[dateStr] ? (serverSchedule[dateStr].morning || '-') : '-';
            let eAssign = serverSchedule[dateStr] ? (serverSchedule[dateStr].evening || '-') : '-';

            cell.innerHTML = `
                <div class="date-num">${day}일</div>
                <div class="day-content">
                    <div class="schedule-morning">${mAssign}</div>
                    <div class="schedule-evening">${eAssign}</div>
                </div>
            `;
            
            row.appendChild(cell);
            currentCellCount++;

            if (currentCellCount % 5 === 0) {
                tbody.appendChild(row);
                row = document.createElement('tr');
            }
        }

        if (row.children.length > 0) {
            while (row.children.length < 5) {
                let emptyCell = document.createElement('td');
                emptyCell.className = 'empty';
                row.appendChild(emptyCell);
            }
            tbody.appendChild(row);
        }
    }
</script>
