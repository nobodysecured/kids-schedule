<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧸 어린이집 등하원 알리미</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --primary-hover: #fa5252;
            --primary-light: #fff5f5;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-sub: #718096;
            --border-color: #e2e8f0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 15px; 
            color: var(--text-main); 
        }

        .container { 
            max-width: 440px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.06); 
        }

        h2 { 
            text-align: center; 
            color: var(--primary); 
            margin-top: 0; 
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 800;
        }
        
        /* 사용자 고정 알림 배너 */
        .user-banner { 
            background: #e8f4fd; 
            padding: 12px 15px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            font-size: 13px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-left: 4px solid #3182ce;
        }
        .user-banner select { 
            width: auto; 
            margin: 0; 
            padding: 6px 12px; 
            font-weight: bold;
            color: #2b6cb0;
            background: #fff;
            border-radius: 6px;
            border: 1px solid #bbeeff;
        }

        /* 탭 메뉴 스타일 */
        .tab-menu { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 20px; 
            background: #edf2f7; 
            padding: 5px; 
            border-radius: 10px; 
        }
        .tab-btn { 
            flex: 1; 
            padding: 11px 0; 
            border: none; 
            background: none; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 13px; 
            color: var(--text-sub);
            transition: all 0.2s ease;
        }
        .tab-btn.active { 
            background: var(--primary); 
            color: white; 
            box-shadow: 0 3px 8px rgba(255, 107, 107, 0.35);
        }

        /* 탭 내용 영역 */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .box { 
            background: var(--primary-light); 
            padding: 18px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #fed7d7;
        }

        label { 
            font-weight: bold; 
            display: block; 
            margin-bottom: 6px; 
            font-size: 13px; 
            color: var(--text-main); 
        }

        select, textarea, input, button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 4px; 
            margin-bottom: 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px;
            background: #fff;
            outline: none;
        }
        
        select:focus, textarea:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.15);
        }

        button { 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s;
            margin-bottom: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        button:hover { background-color: var(--primary-hover); }
        
        /* 알림장 메모 리스트 카드 스타일 */
        .memo-list { 
            background: #ffffff; 
            padding: 14px 16px; 
            border-radius: 10px; 
            margin-top: 10px; 
            font-size: 13px; 
            border-left: 4px solid var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border-top: 1px solid #edf2f7;
            border-right: 1px solid #edf2f7;
            border-bottom: 1px solid #edf2f7;
        }
        .memo-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--text-sub);
        }
        .memo-content {
            color: var(--text-main);
            line-height: 1.4;
            word-break: break-all;
        }

        /* 평일 달력 스타일 */
        .calendar-box { text-align: center; }
        .calendar-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
        }
        .calendar-header button { 
            width: auto; 
            padding: 6px 14px; 
            margin: 0; 
            font-size: 12px; 
            background: #4a5568;
        }
        .calendar-header button:hover { background: #2d3748; }

        .calendar-table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 4px; 
        }
        .calendar-table th, .calendar-table td { 
            border: 1px solid var(--border-color); 
            padding: 6px; 
            font-size: 11px; 
            height: 68px; 
            vertical-align: top; 
            text-align: left; 
            width: 20%; 
            border-radius: 6px;
        }
        .calendar-table th { 
            background: #edf2f7; 
            color: #4a5568; 
            text-align: center; 
            font-size: 12px; 
            padding: 8px 0; 
        }
        .calendar-table td { background: #fff; }
        .calendar-table td.today { 
            background: var(--primary-light); 
            font-weight: bold; 
            border: 2px solid var(--primary); 
        }
        .calendar-table td.empty { background: #f7fafc; border: 1px dashed #e2e8f0; }
        
        .date-num {
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 4px;
            color: var(--text-main);
            border-bottom: 1px solid #edf2f7;
            padding-bottom: 2px;
        }
        .schedule-text { 
            font-size: 10px; 
            margin-top: 2px; 
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🧸 우리 아이 등하원 알리미</h2>

    <!-- 핸드폰별 사용자 고정 배너 -->
    <div class="user-banner">
        <span>📱 현재 사용자: <strong id="displayUser" style="color:#2b6cb0;">설정 필요</strong></span>
        <select id="deviceUser" onchange="changeDeviceUser()">
            <option value="">선택하기</option>
            <option value="아빠">아빠</option>
            <option value="엄마">엄마</option>
            <option value="외할머니">외할머니</option>
            <option value="친할머니">친할머니</option>
        </select>
    </div>

    <!-- 탭 메뉴 버튼 -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab(0)">등하원 설정하기</button>
        <button class="tab-btn" onclick="switchTab(1)">달력 보기</button>
        <button class="tab-btn" onclick="switchTab(2)">가족 알림장</button>
    </div>

    <!-- 탭 1: 등/하원 설정 -->
    <div class="tab-content active">
        <div class="box">
            <label>📅 날짜 선택</label>
            <input type="date" id="selectDate">

            <label>☀️ 등원하는 사람은</label>
            <select id="morningUser">
                <option value="아빠">아빠</option>
                <option value="엄마">엄마</option>
                <option value="외할머니">외할머니</option>
                <option value="친할머니">친할머니</option>
            </select>

            <label>🌙 하원하는 사람은</label>
            <select id="eveningUser">
                <option value="아빠">아빠</option>
                <option value="엄마">엄마</option>
                <option value="외할머니">외할머니</option>
                <option value="친할머니">친할머니</option>
            </select>
            <button onclick="saveSchedule()">✨ 담당자 저장하기</button>
        </div>
    </div>

    <!-- 탭 2: 평일 달력 현황 -->
    <div class="tab-content">
        <div class="box calendar-box">
            <div class="calendar-header">
                <button onclick="moveMonth(-1)">◀ 이전달</button>
                <h3 id="calendarTitle" style="margin:0; font-size:15px; color:var(--text-main);">2026년 6월</h3>
                <button onclick="moveMonth(1)">다음달 ▶</button>
            </div>
            <table class="calendar-table">
                <thead>
                    <tr>
                        <th>월</th><th>화</th><th>수</th><th>목</th><th>금</th>
                    </tr>
                </thead>
                <tbody id="calendarBody">
                    <!-- 달력이 동적으로 생성됩니다 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 탭 3: 가족 알림장 메모 -->
    <div class="tab-content">
        <div class="box">
            <label>📝 실시간 공유 메모</label>
            <textarea id="memoText" rows="3" placeholder="약 투여, 준비물 등 특이사항을 적어주세요"></textarea>
            <button onclick="saveMemo()">💬 메모 남기기</button>
        </div>
        <div id="memoBoard" style="margin-top: 10px;">
            <div style="font-size:12px; color:#888; text-align:center; padding:15px;">데이터 불러오는 중...</div>
        </div>
    </div>
</div>

<script>
    // ⚠️ [중요] 아까 복사한 구글 앱스 스크립트 '웹 앱 URL'
    const API_URL = 'https://script.google.com/macros/s/AKfycbyHPJ1Uykyj0bZM4GOBBZ5KXbLgBX2mNrF_NeFT8KaaX-ucLfaYN9olHzNnC1F_uNM/exec';

    let todayObj = new Date();
    let currentYear = todayObj.getFullYear();
    let currentMonth = todayObj.getMonth();
    let serverSchedule = {}; // 서버에서 불러온 스케줄 데이터 보관

    document.getElementById('selectDate').valueAsDate = todayObj;

    window.onload = function() {
        initDeviceUser();
        fetchAllData();
    }

    function initDeviceUser() {
        let savedUser = localStorage.getItem('my_device_user');
        if(savedUser) {
            document.getElementById('deviceUser').value = savedUser;
            document.getElementById('displayUser').innerText = savedUser;
        }
    }

    function changeDeviceUser() {
        let selected = document.getElementById('deviceUser').value;
        if(selected) {
            localStorage.setItem('my_device_user', selected);
            document.getElementById('displayUser').innerText = selected;
            alert("이 기기의 사용자가 '" + selected + "(으)로' 고정되었습니다!");
        }
    }

    document.getElementById('selectDate').addEventListener('change', loadScheduleForDate);

    function switchTab(index) {
        let buttons = document.querySelectorAll('.tab-btn');
        let contents = document.querySelectorAll('.tab-content');
        
        buttons.forEach((btn, idx) => {
            if(idx === index) {
                btn.classList.add('active');
                contents[idx].classList.add('active');
            } else {
                btn.classList.remove('active');
                contents[idx].classList.remove('active');
            }
        });
        if(index === 1) generateCalendar();
    }

    // 서버(구글 시트)에서 모든 데이터 불러오기
    function fetchAllData() {
        if (API_URL.includes('여기에')) {
            alert('HTML 코드 내의 API_URL에 구글 웹 앱 주소를 입력해주세요!');
            return;
        }

        // 스케줄 불러오기
        fetch(API_URL + '?action=getSchedule')
            .then(res => res.json())
            .then(data => {
                serverSchedule = data;
                loadScheduleForDate();
                generateCalendar();
            })
            .catch(err => console.log('스케줄 로딩 실패', err));

        // 메모 불러오기
        fetch(API_URL + '?action=getMemos')
            .then(res => res.json())
            .then(data => {
                let board = document.getElementById('memoBoard');
                board.innerHTML = '';
                if(data.length === 0) {
                    board.innerHTML = '<div style="font-size:12px; color:#888; text-align:center; padding:15px;">등록된 메모가 없습니다.</div>';
                    return;
                }
                data.forEach(m => {
                    let div = document.createElement('div');
                    div.className = 'memo-list';
                    div.innerHTML = `
                        <div class="memo-header">
                            <strong>👤 ${m.user}</strong>
                            <span>${m.time}</span>
                        </div>
                        <div class="memo-content">${m.text}</div>
                    `;
                    board.appendChild(div);
                });
            })
            .catch(err => console.log('메모 로딩 실패', err));
    }

    function saveSchedule() {
        let date = document.getElementById('selectDate').value;
        let morning = document.getElementById('morningUser').value;
        let evening = document.getElementById('eveningUser').value;
        
        let payload = {
            action: 'saveSchedule',
            date: date,
            morning: morning,
            evening: evening
        };

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
            alert(date + " 정상적으로 저장되었습니다!");
            fetchAllData(); // 데이터 새로고침
        })
        .catch(err => {
            alert('저장 중 오류가 발생했습니다.');
            console.log(err);
        });
    }

    function loadScheduleForDate() {
        let date = document.getElementById('selectDate').value;
        if(serverSchedule[date]) {
            document.getElementById('morningUser').value = serverSchedule[date].morning || '아빠';
            document.getElementById('eveningUser').value = serverSchedule[date].evening || '아빠';
        } else {
            document.getElementById('morningUser').value = '아빠';
            document.getElementById('eveningUser').value = '아빠';
        }
    }

    function saveMemo() {
        let user = localStorage.getItem('my_device_user');
        if(!user) return alert("상단에서 먼저 본인의 사용자(아빠/엄마 등)를 선택해주세요!");
        
        let text = document.getElementById('memoText').value;
        if(!text.trim()) return alert("내용을 입력해주세요!");

        let payload = {
            action: 'saveMemo',
            user: user,
            text: text,
            time: new Date().toLocaleString()
        };

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
            document.getElementById('memoText').value = '';
            fetchAllData(); // 메모 목록 즉시 갱신
        })
        .catch(err => {
            alert('메모 저장 중 오류가 발생했습니다.');
            console.log(err);
        });
    }

    function moveMonth(step) {
        currentMonth += step;
        if(currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        } else if(currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        generateCalendar();
    }

    function generateCalendar() {
        document.getElementById('calendarTitle').innerText = `${currentYear}년 ${currentMonth + 1}월`;

        let firstDayObj = new Date(currentYear, currentMonth, 1);
        let lastDateObj = new Date(currentYear, currentMonth + 1, 0);
        
        let lastDate = lastDateObj.getDate();
        let tbody = document.getElementById('calendarBody');
        tbody.innerHTML = '';

        let row = document.createElement('tr');
        let firstDayOfWeek = firstDayObj.getDay();
        let startIndex = 0;
        
        if (firstDayOfWeek >= 1 && firstDayOfWeek <= 5) {
            startIndex = firstDayOfWeek - 1;
        } else if (firstDayOfWeek === 6) {
            startIndex = 5;
        }

        let currentCellCount = 0;
        if (firstDayOfWeek >= 1 && firstDayOfWeek <= 5) {
            for (let i = 0; i < startIndex; i++) {
                let emptyCell = document.createElement('td');
                emptyCell.className = 'empty';
                row.appendChild(emptyCell);
                currentCellCount++;
            }
        }

        for (let day = 1; day <= lastDate; day++) {
            let dateObj = new Date(currentYear, currentMonth, day);
            let dayOfWeek = dateObj.getDay();

            if (dayOfWeek === 0 || dayOfWeek === 6) continue;

            let cell = document.createElement('td');
            let mm = String(currentMonth + 1).padStart(2, '0');
            let dd = String(day).padStart(2, '0');
            let dateStr = `${currentYear}-${mm}-${dd}`;

            let todayStr = new Date().toISOString().split('T')[0];
            if (dateStr === todayStr) {
                cell.classList.add('today');
            }

            let mAssign = '-';
            let eAssign = '-';
            if (serverSchedule[dateStr]) {
                mAssign = serverSchedule[dateStr].morning || '-';
                eAssign = serverSchedule[dateStr].evening || '-';
            }

            cell.innerHTML = `
                <div class="date-num">${day}일</div>
                <div class="schedule-text" style="color:#2b6cb0;">등: ${mAssign}</div>
                <div class="schedule-text" style="color:#c53030;">하: ${eAssign}</div>
            `;
            
            row.appendChild(cell);
            currentCellCount++;

            if (currentCellCount % 5 === 0) {
                tbody.appendChild(row);
                row = document.createElement('tr');
            }
        }

        if (row.children.length > 0) {
            while (row.children.length < 5) {
                let emptyCell = document.createElement('td');
                emptyCell.className = 'empty';
                row.appendChild(emptyCell);
            }
            tbody.appendChild(row);
        }
    }
</script>

</body>
</html>
