<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어린이집 등하원 알리미</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #ff6b6b; }
        .box { background: #fdf0ed; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        select, textarea, button { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #ff6b6b; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #fa5252; }
        .memo-list { background: #f8f9fa; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 14px; border-left: 4px solid #ff6b6b; }
    </style>
</head>
<body>

<div class="container">
    <h2>🧸 우리 아이 등하원 알리미</h2>

    <!-- 1 & 4번 기능: 사용자 선택 및 담당자 지정 -->
    <div class="box">
        <label>👤 접속한 사람 선택:</label>
        <select id="currentUser">
            <option value="아빠">아빠</option>
            <option value="엄마">엄마</option>
            <option value="외할머니">외할머니</option>
            <option value="친할머니">친할머니</option>
        </select>

        <label>☀️ 오늘 등원 담당:</label>
        <select id="morningUser">
            <option value="아빠">아빠</option>
            <option value="엄마">엄마</option>
            <option value="외할머니">외할머니</option>
            <option value="친할머니">친할머니</option>
        </select>

        <label>🌙 오늘 하원 담당:</label>
        <select id="eveningUser">
            <option value="아빠">아빠</option>
            <option value="엄마">엄마</option>
            <option value="외할머니">외할머니</option>
            <option value="친할머니">친할머니</option>
        </select>
        <button onclick="saveSchedule()">담당자 저장하기</button>
    </div>

    <!-- 3번 기능: 특이사항 메모 -->
    <div class="box">
        <label>📝 실시간 공유 메모 (알림장)</label>
        <textarea id="memoText" rows="3" placeholder="선생님 말씀, 준비물 등을 적어주세요"></textarea>
        <button onclick="saveMemo()">메모 남기기</button>
        <div id="memoBoard"></div>
    </div>
</div>

<script>
    // 간단한 데이터 저장 (새로고침해도 유지되도록 브라우저 저장소 활용)
    window.onload = function() {
        if(localStorage.getItem('morning')) document.getElementById('morningUser').value = localStorage.getItem('morning');
        if(localStorage.getItem('evening')) document.getElementById('eveningUser').value = localStorage.getItem('evening');
        loadMemos();
    }

    function saveSchedule() {
        let m = document.getElementById('morningUser').value;
        let e = document.getElementById('eveningUser').value;
        localStorage.setItem('morning', m);
        localStorage.setItem('evening', e);
        alert("오늘의 담당자가 저장되었습니다!");
    }

    function saveMemo() {
        let user = document.getElementById('currentUser').value;
        let text = document.getElementById('memoText').value;
        if(!text.trim()) return alert("내용을 입력해주세요!");

        let memos = JSON.parse(localStorage.getItem('memos') || '[]');
        memos.unshift({user: user, text: text, time: new Date().toLocaleTimeString()});
        localStorage.setItem('memos', JSON.stringify(memos));

        document.getElementById('memoText').value = '';
        loadMemos();
    }

    function loadMemos() {
        let memos = JSON.parse(localStorage.getItem('memos') || '[]');
        let board = document.getElementById('memoBoard');
        board.innerHTML = '';
        memos.forEach(m => {
            let div = document.createElement('div');
            div.className = 'memo-list';
            div.innerHTML = `<strong>${m.user}</strong> (${m.time})<br>${m.text}`;
            board.appendChild(div);
        });
    }
</script>

</body>
</html>
